name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Windows startup scripts
        shell: powershell
        run: |
          foreach ($path in @('scripts/install-startup.ps1', 'scripts/remove-startup.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path has PowerShell syntax errors: $($errors | Out-String)" }
          }
      - name: Restore
        run: dotnet restore MyBrowserAgent.sln
      - name: Build
        run: dotnet build MyBrowserAgent.sln -c Release --no-restore

      - name: Reject a second Agent instance
        shell: powershell
        run: |
          $createdNew = $false
          $mutex = [System.Threading.Mutex]::new($true, 'Global\MyBrowserAgent', [ref]$createdNew)
          try {
            if (-not $createdNew) { throw 'The test mutex already exists.' }
            $output = & '.\src\MyBrowserAgent\bin\Release\net472\MyBrowserAgent.exe' 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Second instance exited with ${LASTEXITCODE}: $output" }
            if (($output | Out-String) -notmatch 'already running') {
              throw "Second instance did not report the existing Agent: $output"
            }
          }
          finally {
            if ($createdNew) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          }
